# Production overlay for single-host deployment. Use together with the base
# compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What this changes versus the base (dev) file:
#   - Removes direct host port exposure for postgres/api — Caddy is the only
#     public entry point now, terminating TLS and reverse-proxying to both.
#   - Adds the `web` service (CMS, built and served via nginx) and the `proxy`
#     service (Caddy — automatic HTTPS via Let's Encrypt when DOMAIN is a
#     real, publicly resolvable DNS name; see deploy/Caddyfile for the
#     domain-less HTTP fallback).
#   - CORS origin defaults to the same DOMAIN so the CMS's own served origin
#     is what's allowed to call the API, instead of localhost:5173.

services:
  postgres:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://${DOMAIN:-localhost}}

  web:
    build:
      context: ./web-cms
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: iemas-web
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    container_name: iemas-proxy
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set to a real hostname for automatic HTTPS, or edit deploy/Caddyfile to use the domain-less :80 block only}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

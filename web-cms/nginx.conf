server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The CMS calls the API on its own origin (/api/v1), so this container must forward API and
    # SignalR traffic itself when it is reached directly rather than through Caddy.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — client-side routing owns everything not matched above/by a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
